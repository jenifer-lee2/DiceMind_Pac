<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Dado 3D do Dice Mind" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="topo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9A94FF"/>
      <stop offset="1" stop-color="#6C63FF"/>
    </linearGradient>
    <linearGradient id="esq" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A4FB5"/>
      <stop offset="1" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="dir" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14267F"/>
      <stop offset="1" stop-color="#0D1B6E"/>
    </linearGradient>
    <radialGradient id="sombra" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6C63FF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#6C63FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- brilho e sombra -->
  <ellipse cx="200" cy="362" rx="140" ry="22" fill="url(#sombra)"/>

  <!-- faces -->
  <polygon points="200,60 320,130 200,200 80,130" fill="url(#topo)" stroke="#C0C0C0" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="80,130 200,200 200,340 80,270" fill="url(#esq)" stroke="#C0C0C0" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="200,200 320,130 320,270 200,340" fill="url(#dir)" stroke="#C0C0C0" stroke-width="3" stroke-linejoin="round"/>

  <!-- reflexo na aresta superior -->
  <polyline points="90,128 200,66 310,128" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round"/>

  <!-- pontos: topo (6) -->
  <g transform="matrix(120 70 -120 70 200 60)" fill="#FFFFFF">
    <circle cx="0.28" cy="0.2" r="0.075"/>
    <circle cx="0.28" cy="0.5" r="0.075"/>
    <circle cx="0.28" cy="0.8" r="0.075"/>
    <circle cx="0.72" cy="0.2" r="0.075"/>
    <circle cx="0.72" cy="0.5" r="0.075"/>
    <circle cx="0.72" cy="0.8" r="0.075"/>
  </g>

  <!-- pontos: esquerda (3) -->
  <g transform="matrix(120 70 0 140 80 130)" fill="#FFFFFF">
    <circle cx="0.25" cy="0.25" r="0.085"/>
    <circle cx="0.5" cy="0.5" r="0.085"/>
    <circle cx="0.75" cy="0.75" r="0.085"/>
  </g>

  <!-- pontos: direita (2) -->
  <g transform="matrix(120 -70 0 140 200 200)" fill="#FFFFFF">
    <circle cx="0.28" cy="0.28" r="0.085"/>
    <circle cx="0.72" cy="0.72" r="0.085"/>
  </g>
</svg>
